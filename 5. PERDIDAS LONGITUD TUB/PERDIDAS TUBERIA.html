<style>
:root{--ink:#14213d;--muted:#61708b;--paper:#f7f9fc;--card:#fff;--line:#dfe6ef;--navy:#0d2444;--blue:#246bfd;--cyan:#38bdf8;--orange:#f47b20;--green:#18a87b;--red:#ef4444;--shadow:0 18px 50px rgba(20,33,61,.12);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0;min-height:100%;background:radial-gradient(circle at 15% 0,#e6f4ff 0,transparent 32%),var(--paper)}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1500px;margin:auto;padding:18px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:13px}.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,var(--blue),#163ea4);display:grid;place-items:center;color:#fff;box-shadow:0 10px 26px rgba(36,107,253,.28);font-size:26px}.brand h1{font-size:1.1rem;margin:0}.brand p{font-size:.78rem;color:var(--muted);margin:3px 0 0}.top-actions{display:flex;align-items:center;gap:8px}.student{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px 7px 5px 11px;font-size:.72rem;font-weight:750}.student input{width:180px;border:0;background:#f4f7fb;padding:7px 9px;border-radius:8px;outline:none}.icon-btn{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--ink);display:grid;place-items:center}.grid{display:grid;grid-template-columns:minmax(245px,285px) minmax(520px,1fr) minmax(295px,340px);gap:16px}.panel{background:rgba(255,255,255,.94);border:1px solid rgba(214,224,238,.9);border-radius:20px;box-shadow:0 7px 28px rgba(20,33,61,.06)}.sidebar{padding:18px;display:flex;flex-direction:column;gap:15px}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.65rem}.sidebar h2,.right h2{font-size:.96rem;margin:5px 0}.copy{font-size:.75rem;color:var(--muted);line-height:1.5;margin:0}.step-list{display:flex;flex-direction:column;gap:5px}.step{display:grid;grid-template-columns:28px 1fr;gap:9px;padding:7px 9px;border-radius:11px;color:var(--muted);font-size:.73rem;line-height:1.25}.step-num{width:26px;height:26px;border-radius:50%;background:#edf1f7;display:grid;place-items:center;font-weight:800}.step.active{background:#edf4ff;color:var(--ink)}.step.active .step-num{background:var(--blue);color:#fff}.step.done .step-num{background:#dcf8ef;color:var(--green)}.control label{display:flex;justify-content:space-between;gap:8px;font-size:.73rem;font-weight:760;margin-bottom:5px}.control label span{color:var(--blue)}select,input[type=number]{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);outline:none}select:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(36,107,253,.1)}input[type=range]{width:100%;accent-color:var(--blue)}.inline-controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:11px;padding:10px 12px;font-weight:800;font-size:.76rem;display:flex;align-items:center;justify-content:center;gap:7px}.primary{background:var(--blue);color:#fff;box-shadow:0 9px 18px rgba(36,107,253,.2)}.secondary{background:#eef3fa;color:var(--ink)}.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lab{min-height:630px;overflow:hidden;position:relative;display:flex;flex-direction:column}.lab-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.lab-head h2{font-size:.94rem;margin:0}.status{display:flex;align-items:center;gap:7px;color:var(--green);font-size:.73rem;font-weight:800}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(24,168,123,.1)}.scene{position:relative;min-height:500px;flex:1;background:linear-gradient(#f9fcff,#eef5fb);overflow:hidden}.scene:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(63,93,132,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(63,93,132,.035) 1px,transparent 1px);background-size:24px 24px}.diagram{position:absolute;inset:20px 18px 15px}.tank{position:absolute;left:4%;top:25%;width:22%;height:43%;border:4px solid #6b7787;border-radius:18px 18px 8px 8px;background:linear-gradient(to top,#7ab8f7 0 62%,#dce8f4 62%);box-shadow:inset 12px 0 18px rgba(255,255,255,.45),0 12px 24px rgba(20,33,61,.14)}.tank:before{content:"";position:absolute;left:20%;right:20%;top:-16px;height:20px;border-radius:50%;background:linear-gradient(#f8fafc,#768292);border:3px solid #66717f}.tank:after{content:"DEPÓSITO";position:absolute;left:0;right:0;bottom:17px;text-align:center;font-size:.66rem;font-weight:900;color:#17355f}.leg{position:absolute;top:68%;width:5px;height:14%;background:#687482}.leg.one{left:8%}.leg.two{left:21%}.pipe{position:absolute;left:25%;right:9%;top:48%;height:25px;border:3px solid #687482;background:linear-gradient(#cbd1d7,#606a73 48%,#e2e6e9);box-shadow:0 8px 11px rgba(20,33,61,.15)}.water-line{position:absolute;left:25%;top:calc(48% + 8px);height:9px;width:0;background:linear-gradient(90deg,#1976d2,#59c6ff);transition:width 1.2s ease;box-shadow:0 0 8px #38bdf8}.water-line.running{width:66%}.pipe-label{position:absolute;left:44%;top:58%;font-size:.72rem;font-weight:850;color:#16366d}.flowmeter{position:absolute;left:61%;top:35%;width:84px;height:83px;background:#202933;border:5px solid #68727c;border-radius:7px;z-index:4;box-shadow:0 8px 15px rgba(20,33,61,.18)}.flowmeter .screen{margin:7px;background:#dff4ec;border:3px solid #080b0e;height:31px;display:grid;place-items:center;font:800 .72rem ui-monospace,monospace}.flowmeter:after{content:"FLUJÓMETRO";position:absolute;top:84px;left:-8px;font-size:.61rem;font-weight:900}.drops{position:absolute;right:5%;top:51%;display:flex;gap:8px;transform:rotate(20deg);opacity:0;transition:.3s}.drops.on{opacity:1}.drop{width:7px;height:12px;background:#38bdf8;border-radius:50% 50% 50% 0;transform:rotate(-45deg);animation:fall .7s infinite alternate}.drop:nth-child(2){animation-delay:.2s}.drop:nth-child(3){animation-delay:.4s}@keyframes fall{to{transform:translate(8px,12px) rotate(-45deg);opacity:.25}}.bucket{position:absolute;right:1%;top:62%;width:72px;height:72px;background:linear-gradient(90deg,#7278ca,#a8aceb);clip-path:polygon(9% 0,91% 0,78% 100%,22% 100%);border-top:5px solid #d4d7ff}.gauges{position:absolute;left:34%;top:22%;right:16%;display:flex;justify-content:space-between}.gauge{width:55px;height:55px;border-radius:50%;background:#fff;border:5px solid #3e4854;box-shadow:0 6px 13px rgba(20,33,61,.15);position:relative}.gauge:before{content:"";position:absolute;width:3px;height:19px;background:var(--red);left:22px;top:8px;transform-origin:bottom;transform:rotate(var(--needle,-40deg));transition:.8s}.gauge:after{content:attr(data-label);position:absolute;top:59px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.6rem;font-weight:900}.formula-card{position:absolute;right:3%;top:4%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 10px 25px rgba(20,33,61,.08);font-family:Georgia,serif;text-align:center}.formula-card b{display:block;font-size:1.1rem;margin-top:4px}.legend{position:absolute;left:3%;bottom:3%;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:.64rem;line-height:1.55;color:var(--muted)}.legend b{color:var(--ink)}.lab-foot{padding:10px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);font-size:.7rem;color:var(--muted)}.formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#eef3f8;padding:6px 9px;border-radius:8px;color:var(--ink)}.toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:10px 15px;border-radius:12px;font-size:.73rem;opacity:0;pointer-events:none;transition:.25s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}.right{padding:16px;display:flex;flex-direction:column;gap:12px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#f4f7fb;padding:10px;border-radius:12px}.metric small{font-size:.62rem;color:var(--muted);display:block;margin-bottom:4px}.metric strong{font-size:.98rem}.metric span{font-size:.62rem;color:var(--muted)}.answer{padding:12px;border:1px dashed #b5c4d8;border-radius:13px}.answer label{font-size:.71rem;font-weight:800}.input-with-unit{display:flex;align-items:center;margin-top:6px}.input-with-unit input{border-radius:9px 0 0 9px}.input-with-unit span{padding:9px;background:#eef3f8;border:1px solid var(--line);border-left:0;border-radius:0 9px 9px 0;font-size:.72rem}.feedback{min-height:16px;font-size:.69rem;margin-top:7px;font-weight:750}.history-head{display:flex;justify-content:space-between;align-items:center}.history-head span{font-size:.65rem;color:var(--muted)}.table-wrap{overflow:auto;max-height:175px}table{border-collapse:collapse;width:100%;font-size:.62rem}th{color:var(--muted);font-weight:750;text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}td{padding:7px 4px;border-bottom:1px solid #edf1f5}.empty{text-align:center;color:var(--muted);padding:18px 5px}.material-chip{display:flex;align-items:center;justify-content:space-between;background:#f4f7fb;padding:9px 11px;border-radius:11px;font-size:.68rem}.material-chip b{font-size:.73rem}.print-btn{border:1px solid #b7e3d6;background:#effaf6;color:#047857;padding:9px 13px;border-radius:12px;font-size:.72rem;font-weight:900;box-shadow:0 3px 8px rgba(4,120,87,.06)}.print-btn:hover{background:#dcf7ee;border-color:#83d6bd}.print-btn:focus-visible{outline:3px solid rgba(16,185,129,.22);outline-offset:2px}.results-title{display:flex;justify-content:space-between;align-items:flex-start}.print-report{display:none}.disabled-note{font-size:.64rem;color:var(--orange);text-align:center;margin:0}
/* Depósito industrial de acero inoxidable */
.tank{left:3.5%;top:21%;width:23.5%;height:48%;overflow:visible;border:0;border-radius:18px 18px 14px 14px;background:linear-gradient(90deg,#697682 0,#c9d0d5 8%,#f6f8f8 24%,#b6c0c7 48%,#f4f6f7 72%,#88949d 95%,#5d6973 100%);box-shadow:inset 0 0 0 3px #68747e,inset 12px 0 22px rgba(255,255,255,.5),inset -15px 0 22px rgba(28,40,51,.25),0 15px 25px rgba(20,33,61,.2)}
.tank:before,.tank:after{content:none}
.tank-water{position:absolute;left:4px;right:4px;bottom:4px;height:72%;overflow:hidden;border-radius:0 0 10px 10px;background:linear-gradient(90deg,#1976c9 0,#6fc9ff 16%,#3b9de8 55%,#1677c7 100%);box-shadow:inset 0 8px 14px rgba(1,71,135,.2)}.tank-water:before{content:"";position:absolute;left:-2%;right:-2%;top:-7px;height:15px;border-radius:50%;background:linear-gradient(#b9e8ff,#49aef1);border:1px solid rgba(4,85,153,.35);animation:waterWave 3s ease-in-out infinite}.tank-water i{position:absolute;top:12px;bottom:0;width:22%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transform:skewX(-9deg)}.tank-water i:nth-child(1){left:7%}.tank-water i:nth-child(2){left:45%;opacity:.45}.tank-water i:nth-child(3){right:2%;opacity:.25}@keyframes waterWave{50%{transform:translateY(2px) scaleX(.98)}}
.tank-shine{position:absolute;left:10%;top:9%;width:18%;height:46%;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.72),transparent);filter:blur(2px);opacity:.8}.tank-band{position:absolute;left:-2px;right:-2px;height:7px;border:1px solid #58636c;background:linear-gradient(#dbe0e3,#727e87,#cbd2d6);box-shadow:0 2px 3px rgba(20,33,61,.2);z-index:3}.band-top{top:12%}.band-bottom{bottom:9%}.tank-label{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:4;text-align:center;background:rgba(236,244,249,.86);border:1px solid rgba(77,96,111,.45);border-radius:7px;padding:6px 10px;box-shadow:0 4px 8px rgba(20,33,61,.13)}.tank-label span{display:block;font-size:.65rem;font-weight:950;letter-spacing:.08em;color:#193b60}.tank-label small{display:block;margin-top:2px;font-size:.48rem;font-weight:800;color:#41627f;white-space:nowrap}.tank-outlet{position:absolute;right:-24px;top:54%;width:29px;height:29px;z-index:5;border:4px solid #5c6871;border-radius:5px;background:linear-gradient(#d9dfe2,#66727b 48%,#e5e8e9);box-shadow:0 3px 5px rgba(20,33,61,.2)}.tank-outlet:before{content:"";position:absolute;left:-7px;top:-6px;width:7px;height:33px;border-radius:3px;background:linear-gradient(90deg,#59656e,#e2e6e8,#68737c)}
.leg{top:69%;width:13px;height:14%;border-radius:0 0 5px 5px;background:linear-gradient(90deg,#505c65,#d9dfe2 45%,#68747d);box-shadow:3px 5px 6px rgba(20,33,61,.18)}.leg.one{left:7%}.leg.two{left:21%}.leg i{position:absolute;left:-7px;bottom:-5px;width:27px;height:7px;border-radius:4px;background:linear-gradient(#b8c1c7,#59646d);box-shadow:0 3px 5px rgba(20,33,61,.18)}
/* Unión alineada entre el depósito y la tubería */
.inline-controls{grid-template-columns:1fr}.diameter-control{display:grid;grid-template-columns:auto minmax(135px,1fr);align-items:center;gap:12px}.diameter-control label{margin:0;white-space:nowrap}.diameter-control select{min-width:0}
.pipe{left:26.3%;top:calc(50.5% - var(--pipe-height,25px)/2);height:var(--pipe-height,25px);z-index:1;border-color:var(--pipe-edge,#687482);background:linear-gradient(var(--pipe-light,#cbd1d7) 0,var(--pipe-color,#606a73) 42%,var(--pipe-edge,#4e5962) 58%,var(--pipe-light,#e2e6e9) 100%);transition:height .4s ease,top .4s ease,background .45s ease,border-color .45s ease;box-shadow:inset 0 3px 4px rgba(255,255,255,.35),0 8px 11px rgba(20,33,61,.15)}.water-line{left:26.3%;top:calc(50.5% - var(--water-height,9px)/2);height:var(--water-height,9px);z-index:2;transition:width var(--flow-duration,1.2s) ease,height .4s ease,top .4s ease}.water-line.running{width:64.7%}
/* Flujómetro digital moderno, apoyado sobre la tubería */
.flowmeter{left:61%;top:calc(50.5% - var(--pipe-height,25px)/2 - 86px);width:94px;height:86px;z-index:5;border:0;border-radius:15px 15px 7px 7px;background:linear-gradient(145deg,#0d3151,#071b30 72%);box-shadow:inset 0 0 0 2px rgba(100,211,255,.28),inset 0 9px 16px rgba(69,184,236,.12),0 9px 17px rgba(7,27,48,.3);overflow:visible;transition:top .4s ease}
.flowmeter:before{content:"FLUJÓMETRO";position:absolute;left:50%;top:-25px;transform:translateX(-50%);white-space:nowrap;color:#12315b;font-size:.65rem;font-weight:950;letter-spacing:.08em}
.flowmeter:after{content:"●  EN LÍNEA";position:absolute;left:50%;bottom:8px;top:auto;transform:translateX(-50%);white-space:nowrap;color:#67e8c2;font-size:.48rem;font-weight:850;letter-spacing:.07em}
.flowmeter .screen{position:relative;margin:10px 9px 0;height:39px;border:1px solid #5ee0ff;border-radius:7px;background:linear-gradient(135deg,#d8fbff,#9fe9f4);box-shadow:inset 0 0 9px rgba(17,94,125,.22),0 0 0 3px rgba(21,108,148,.25);color:#082b42;font-size:.68rem;text-shadow:0 1px rgba(255,255,255,.8)}
.flowmeter .screen:after{content:"Q";position:absolute;right:5px;top:3px;color:#167da4;font-size:.48rem;font-weight:950}
.pipe-label{font-size:.9rem;color:var(--green);font-weight:950;letter-spacing:.02em;text-shadow:0 1px 0 #fff}
.tank-outlet{right:-25px;top:calc(56.25% - 14px);width:27px;height:28px;border:3px solid #53616b;border-radius:2px 6px 6px 2px;background:linear-gradient(#eef2f3 0,#9eaab2 22%,#64717a 48%,#d9dfe2 78%,#7d8991 100%);box-shadow:0 3px 6px rgba(20,33,61,.24);z-index:6}
.tank-outlet:before{content:"";position:absolute;left:-8px;top:-7px;width:9px;height:36px;border:2px solid #56636d;border-radius:3px;background:linear-gradient(90deg,#78848d,#eef1f2 48%,#69757e);box-shadow:1px 2px 4px rgba(20,33,61,.22)}
.tank-outlet:after{content:"";position:absolute;right:-13px;top:4px;width:13px;height:14px;border-top:3px solid #5e6a73;border-bottom:3px solid #5e6a73;background:linear-gradient(#d9dfe2,#69757e 48%,#e5e8e9);z-index:-1}
@media(max-width:1080px){.grid{grid-template-columns:260px 1fr}.right{grid-column:1/-1}.right{display:grid;grid-template-columns:1fr 1fr}.right>section:last-child{grid-column:1/-1}}
@media(max-width:750px){.app{padding:10px}.grid{grid-template-columns:1fr}.right{grid-column:auto;display:flex}.topbar{align-items:flex-start;flex-direction:column}.student input{width:150px}.scene{min-height:470px}.diagram{transform:scale(.72);transform-origin:center}.lab-foot{align-items:flex-start;flex-direction:column}.inline-controls{grid-template-columns:1fr}}
@media(min-width:1081px){html,body{height:100%;overflow:hidden}.app{height:100%;max-width:none;padding:10px 16px;display:flex;flex-direction:column}.topbar{flex:0 0 54px;margin-bottom:8px}.grid{flex:1;min-height:0}.panel{min-height:0}.sidebar{padding:13px 15px;gap:9px;overflow:auto}.lab{min-height:0}.scene{min-height:0}.right{padding:12px 14px;gap:7px;overflow:hidden}.metric{padding:8px}.answer{padding:9px}.table-wrap{max-height:120px}}
@media print{body{background:#fff}.app{display:none}.print-report{display:block;color:#14213d;font-family:Arial,sans-serif;padding:8mm}.report-head{display:flex;justify-content:space-between;border-bottom:3px solid #246bfd;padding-bottom:10px}.report-head h1{margin:0;font-size:22px}.report-head p{margin:4px 0;font-size:11px}.report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0}.report-stat{background:#eef4ff;padding:10px;border-radius:8px}.report-stat small{display:block;color:#61708b}.report-stat strong{font-size:15px}.print-report table{font-size:10px}.print-report th,.print-report td{padding:7px;border:1px solid #cbd5e1}.report-note{margin-top:14px;border:1px solid #cbd5e1;padding:10px;font-size:11px}.report-sign{margin-top:45px;width:220px;border-top:1px solid #14213d;text-align:center;padding-top:5px;font-size:10px}}
.cfd-open{border:0;border-radius:9px;padding:6px 10px;background:#e6f7ff;color:#075985;font-size:.67rem;font-weight:850}.cfd-modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:24px;background:rgba(5,19,38,.72);backdrop-filter:blur(5px)}.cfd-modal.open{display:grid}.cfd-dialog{position:relative;width:min(1050px,96vw);background:#fff;border-radius:19px;padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.38)}.cfd-dialog img{display:block;width:100%;height:auto;border-radius:12px}.cfd-close{position:absolute;right:20px;top:20px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(8,31,54,.88);color:#fff;font-size:20px;font-weight:800;z-index:2}
.formula-result{margin:-4px -7px 9px;padding:7px 9px;border-radius:9px;background:#e7f8f2;border:1px solid #a9e7d4;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.formula-result span{display:block;color:#43806e;font-size:.55rem;font-weight:900;letter-spacing:.12em}.formula-result strong{display:block;margin-top:2px;color:var(--green);font-size:1.05rem}
.control label span{white-space:nowrap;flex-shrink:0}
