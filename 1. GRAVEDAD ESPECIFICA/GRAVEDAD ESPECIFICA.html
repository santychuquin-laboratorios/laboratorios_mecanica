#sourceNote{display:none!important}#newBtn{background:#dff5ec;color:#11765a;box-shadow:0 8px 18px rgba(24,168,123,.12)}.hydrometer-photo{background-size:auto 145px!important;background-position:center center!important}.cylinder-label{font-size:17px;letter-spacing:.035em}.student-field{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:.72rem;font-weight:800;color:var(--muted)}.student-field input{width:230px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:9px 11px;outline:none}.student-field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(36,107,253,.1)}button:disabled,select:disabled,input:disabled{cursor:not-allowed;opacity:.48}.reset-all{color:var(--green);background:#edf8f4;border-color:#b9dace;font-weight:800}.reset-all:hover{background:#dff5ec;border-color:#89c9b4}.results-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.print-btn{border:1px solid #b9d2c8;background:#edf8f4;color:#11765a;border-radius:9px;padding:7px 9px;font-size:.68rem;font-weight:800;white-space:nowrap}.print-btn:hover{background:#dff5ec}.table-wrap.is-scrollable{max-height:190px!important;overflow-y:auto!important;scrollbar-gutter:stable}.print-report{display:none}
@media(max-width:950px){.student-field{order:3;width:100%;margin:4px 0 0}.student-field input{flex:1;width:auto}.topbar{flex-wrap:wrap}}
@media(max-width:740px){.reset-all{display:block!important}}
@media print{@page{size:A4;margin:16mm}html,body{height:auto!important;overflow:visible!important;background:#fff!important}.app{display:none!important}.print-report{display:block!important;color:#172033;font-family:Arial,sans-serif}.print-report .report-head{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:3px solid #246bfd}.print-report h1{font-size:22px;margin:0 0 5px}.print-report h2{font-size:15px;margin:22px 0 8px}.print-report p{font-size:11px;line-height:1.5;margin:3px 0}.print-report .report-meta{text-align:right}.print-report .report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.print-report .report-stat{border:1px solid #d8e1eb;border-radius:8px;padding:10px}.print-report .report-stat small{display:block;color:#66758e;font-size:9px;margin-bottom:5px}.print-report .report-stat strong{font-size:16px}.print-report table{width:100%;border-collapse:collapse;font-size:10px}.print-report th,.print-report td{text-align:left;padding:8px;border-bottom:1px solid #dce3eb}.print-report th{background:#eef3f8}.print-report .report-diagrams{display:grid;grid-template-columns:1fr 1fr;gap:12px}.print-report .report-diagram{border:1px solid #d8e1eb;border-radius:9px;padding:8px;break-inside:avoid;page-break-inside:avoid}.print-report .report-diagram h3{font-size:11px;margin:0 0 4px;text-align:center}.print-report .report-diagram svg{display:block;width:100%;height:auto;max-height:215px}.print-report .report-note{margin-top:18px;padding:10px;background:#f3f7fb;border-left:4px solid #246bfd}.print-report .report-sign{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:55px;text-align:center}.print-report .report-sign div{border-top:1px solid #66758e;padding-top:6px;font-size:10px}}
@media print{.print-report .report-sign{grid-template-columns:1fr;width:45%;margin:55px auto 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

@media(max-width:1050px) and (min-width:741px) { .scene { overflow-x: auto; } .rig, .mesa-ensayo { transform: translateX(-50%) scale(0.85); transform-origin: bottom center; } }


/* FIX PARA PANTALLAS CORTAS (TABLETS EN HORIZONTAL) - SIN SCROLL */
@media (max-height: 850px) and (min-width: 741px) {
  html, body { height: 100% !important; overflow: hidden !important; }
  .app { height: 100% !important; }
  .scene { min-height: 0 !important; }
  .rig, .mesa-ensayo, .machine { transform: translateX(-50%) scale(0.65) !important; transform-origin: bottom center !important; }
  .lab { transform: scale(0.85); transform-origin: top center; }
});
