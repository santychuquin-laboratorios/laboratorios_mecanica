@media print{@page{size:A4;margin:16mm}html,body{height:auto!important;overflow:visible!important;background:#fff!important}.app{display:none!important}.print-report{display:block!important;color:#172033;font-family:Arial,sans-serif}.report-head{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:3px solid #2864dc}.print-report h1{font-size:22px;margin:0 0 5px}.print-report h2{font-size:15px;margin:22px 0 8px}.print-report p{font-size:11px;line-height:1.5;margin:3px 0}.report-meta{text-align:right}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.report-stat{border:1px solid #d8e1eb;border-radius:8px;padding:10px}.report-stat small{display:block;color:#66758e;font-size:9px;margin-bottom:5px}.report-stat strong{font-size:16px}.print-report table{width:100%;border-collapse:collapse;font-size:10px}.print-report th,.print-report td{text-align:left;padding:8px;border-bottom:1px solid #dce3eb}.print-report th{background:#eef3f8}.report-formula{margin-top:18px;padding:12px;background:#172841;color:#fff;border-radius:8px;font-family:Georgia,serif;font-size:14px}.report-note{margin-top:18px;padding:10px;background:#f3f7fb;border-left:4px solid #2864dc}.report-sign{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:65px;text-align:center}.report-sign div{border-top:1px solid #66758e;padding-top:6px;font-size:10px}}
@media print{.report-captures{display:grid;gap:16px}.capture-card{break-inside:avoid;page-break-inside:avoid;border:1px solid #d8e1eb;border-radius:10px;overflow:hidden}.capture-caption{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;background:#eef3f8;font-size:10px}.capture-caption strong{font-size:11px}.capture-frame{height:355px;overflow:hidden}.capture-frame .lab{display:flex!important;width:100%;height:355px;min-height:0;border:0;border-radius:0;box-shadow:none}.capture-frame .lab-head{padding:9px 14px}.capture-frame .scene{height:300px;min-height:0;flex:1}.capture-frame .machine{bottom:-86px;transform:translateX(-50%) scale(.55)!important;transform-origin:bottom center}.capture-frame .timer{transform:scale(.78);transform-origin:top left}.capture-frame .sample-tag{transform:scale(.82);transform-origin:top right}.capture-frame .hint{display:none}.capture-frame .lab-foot{padding:7px 12px}.report-sign{grid-template-columns:280px;justify-content:center;gap:0;margin-top:65px}}
@media print{.print-report,.print-report *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}.capture-frame{height:385px}.capture-frame .lab{height:385px}.capture-frame .scene{height:330px}.capture-frame .machine{bottom:8px;transform:translateX(-50%) scale(.45)!important}.capture-frame .bench{height:48px}.capture-frame .timer{transform:scale(.72)}.capture-frame .sample-tag{transform:scale(.76)}}

@media(max-width:1050px) and (min-width:741px) { .scene { overflow-x: auto; } .rig, .mesa-ensayo, .machine { transform: translateX(-50%) scale(0.85); transform-origin: bottom center; } }


/* FIX PARA PANTALLAS CORTAS (TABLETS EN HORIZONTAL) - SIN SCROLL */
@media (max-height: 850px) and (min-width: 741px) {
  html, body { height: 100% !important; overflow: hidden !important; }
  .app { height: 100% !important; }
  .scene { min-height: 0 !important; }
  .rig, .mesa-ensayo, .machine { transform: translateX(-50%) scale(0.65) !important; transform-origin: bottom center !important; }
  .lab { transform: scale(0.85); transform-origin: top center; }
});
